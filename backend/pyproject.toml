[project]
name = "backend"
version = "0.1.0"
description = "Intelligent IT Help Desk ticket API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "alembic>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
